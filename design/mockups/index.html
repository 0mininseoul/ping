<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ping Glass UI Mockup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="desktop">
    <section class="surface-strip">
      <div class="mirror idle"><div class="preview"></div><div class="chip">👤 김나영 ▾</div></div>
      <div class="mirror recording"><div class="preview warm"></div><div class="count">2 / 1</div></div>
      <div class="mirror all"><div class="preview cool"></div><div class="chip">🌐 모두에게</div></div>
    </section>

    <section class="grid">
      <article class="panel onboarding">
        <h1>Ping에 오신 것을 환영합니다</h1>
        <p>Option+P 한 번으로 2초 영상 메시지를 보내는 가장 빠른 방법.</p>
        <button>시작하기</button>
      </article>

      <article class="panel rooms">
        <h2>내 룸</h2>
        <div class="room-grid">
          <div class="card"><b>박영민 ↔ 김나영</b><span>김나영 · 방금 전</span></div>
          <div class="card"><b>디자인 리뷰</b><span>초대 대기 중</span></div>
          <div class="card"><b>팀 Ping</b><span>온라인</span></div>
          <div class="card"><b>실험실</b><span>어제</span></div>
        </div>
      </article>

      <article class="panel search">
        <h2>룸 찾기</h2>
        <input value="김나영">
        <div class="tabs"><span>룸</span><span>사용자</span></div>
        <div class="result"><b>박영민 ↔ 김나영</b><button>참여 요청</button></div>
        <div class="result"><b>김나영</b><button>초대 보내기</button></div>
      </article>

      <article class="panel settings">
        <aside>일반<br>단축키<br>룸<br>저장<br>정보</aside>
        <div><h2>일반</h2><label><input type="checkbox" checked> 로그인 시 자동 시작</label></div>
      </article>

      <article class="panel invite">
        <b>김나영님이 룸에 초대했습니다</b>
        <span>박영민 ↔ 김나영</span>
        <div><button class="ghost">거부</button><button>수락</button></div>
      </article>
    </section>
  </main>
</body>
</html>
