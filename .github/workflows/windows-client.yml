name: Windows Client

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the signed sideload bundle to a GitHub Release"
        required: false
        type: boolean
        default: false
      publish_web_downloads:
        description: "Commit the signed EXE/MSIX download payloads to web/public/downloads/windows"
        required: false
        type: boolean
        default: false
      upload_artifacts:
        description: "Upload large build artifacts to GitHub Actions storage"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag to create/update when publish_release is true"
        required: false
        type: string
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-client.yml"
      - "project.yml"
      - "README.md"
      - "PING_PROJECT_SPECIFICATION.md"
      - "docs/WINDOWS_APP_SETUP.md"
      - "web/**"
      - "!web/public/downloads/windows/**"
  push:
    branches:
      - main
      - "feat/windows-client"
    paths:
      - "windows/**"
      - ".github/workflows/windows-client.yml"
      - "project.yml"
      - "README.md"
      - "PING_PROJECT_SPECIFICATION.md"
      - "docs/WINDOWS_APP_SETUP.md"
      - "web/**"
      - "!web/public/downloads/windows/**"

jobs:
  build:
    name: Build and test Windows client
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Print tool versions
        shell: pwsh
        run: |
          dotnet --info
          msbuild -version

      - name: Import sideload signing certificate
        shell: pwsh
        env:
          PING_WINDOWS_CERT_BASE64: ${{ secrets.PING_WINDOWS_CERT_BASE64 }}
          PING_WINDOWS_CERT_PASSWORD: ${{ secrets.PING_WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:PING_WINDOWS_CERT_BASE64)) {
            Write-Warning "PING_WINDOWS_CERT_BASE64 is not configured. This run will produce unsigned validation packages."
            "PING_WINDOWS_SIGNED=false" >> $env:GITHUB_ENV
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:PING_WINDOWS_CERT_PASSWORD)) {
            throw "PING_WINDOWS_CERT_PASSWORD must be configured when PING_WINDOWS_CERT_BASE64 is set."
          }

          $certDir = Join-Path $env:RUNNER_TEMP "ping-windows-cert"
          New-Item -ItemType Directory -Force -Path $certDir | Out-Null
          $pfxPath = Join-Path $certDir "Ping-Windows-Sideload.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PING_WINDOWS_CERT_BASE64))
          $securePassword = ConvertTo-SecureString $env:PING_WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $importedCertificate = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $securePassword)[0]
          if (-not $importedCertificate.HasPrivateKey) {
            throw "Imported Windows sideload certificate does not include a private key."
          }
          Import-Certificate -FilePath ".\windows\certs\Ping-Windows-Sideload.cer" -CertStoreLocation "Cert:\CurrentUser\TrustedPeople" | Out-Null
          "PING_WINDOWS_CERT_PATH=$pfxPath" >> $env:GITHUB_ENV
          "PING_WINDOWS_CERT_PASSWORD=$env:PING_WINDOWS_CERT_PASSWORD" >> $env:GITHUB_ENV
          "PING_WINDOWS_CERT_THUMBPRINT=$($importedCertificate.Thumbprint)" >> $env:GITHUB_ENV
          "PING_WINDOWS_SIGNED=true" >> $env:GITHUB_ENV

      - name: Restore managed tests
        shell: pwsh
        run: |
          dotnet restore windows/tests/Ping.Windows.Core.Tests/Ping.Windows.Core.Tests.csproj
          dotnet restore windows/tests/Ping.Windows.App.Tests/Ping.Windows.App.Tests.csproj

      - name: Test managed projects
        shell: pwsh
        run: |
          dotnet test windows/tests/Ping.Windows.Core.Tests/Ping.Windows.Core.Tests.csproj -c Release --no-restore
          dotnet test windows/tests/Ping.Windows.App.Tests/Ping.Windows.App.Tests.csproj -c Release --no-restore

      - name: Write bundled Supabase config
        shell: pwsh
        env:
          PING_SUPABASE_URL: ${{ secrets.PING_SUPABASE_URL }}
          PING_SUPABASE_ANON_KEY: ${{ secrets.PING_SUPABASE_ANON_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $url = $env:PING_SUPABASE_URL
          $anonKey = $env:PING_SUPABASE_ANON_KEY
          $configPath = "windows/src/Ping.Windows.App/Supabase.json"

          if ([string]::IsNullOrWhiteSpace($url) -or [string]::IsNullOrWhiteSpace($anonKey)) {
            if ($env:PING_WINDOWS_SIGNED -eq "true") {
              throw "PING_SUPABASE_URL and PING_SUPABASE_ANON_KEY secrets are required for signed/release builds so the MSIX ships with backend config and works on first launch."
            }
            Write-Warning "Supabase secrets are not configured. Building a validation package without bundled backend config."
            exit 0
          }

          $config = [ordered]@{ url = $url; anonKey = $anonKey }
          Set-Content -LiteralPath $configPath -Value ($config | ConvertTo-Json -Compress) -Encoding utf8
          Write-Host "Wrote bundled Supabase config to $configPath."

      - name: Build packaged app
        shell: pwsh
        run: |
          & .\windows\scripts\build-release.ps1 -Platform x64,ARM64 -SkipTests
          if ($env:PING_WINDOWS_SIGNED -eq "true") {
            & .\windows\scripts\smoke-release.ps1 -Platform x64,ARM64
            & .\windows\scripts\package-sideload-release.ps1 -Platform x64,ARM64
            & .\windows\scripts\build-installer.ps1
          } else {
            & .\windows\scripts\smoke-release.ps1 -Platform x64,ARM64 -AllowUnsigned
            & .\windows\scripts\package-sideload-release.ps1 -Platform x64,ARM64 -AllowUnsigned
          }

      - name: Upload MSIX packages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ping-windows-msix
          path: windows/dist/*.msix
          if-no-files-found: error
          retention-days: 14

      - name: Upload sideload bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ping-windows-sideload
          path: |
            windows/dist/Ping-Windows-v*-sideload/**
            windows/dist/Ping-Windows-v*-sideload.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload EXE installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_artifacts && env.PING_WINDOWS_SIGNED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ping-windows-installer
          path: windows/dist/PingSetup-v*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload public web download payloads
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_artifacts && env.PING_WINDOWS_SIGNED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ping-windows-web-downloads
          path: |
            windows/dist/PingSetup-v*.exe
            windows/dist/Ping-Windows-v*-sideload/Ping-Windows-v*-x64.msix
            windows/dist/Ping-Windows-v*-sideload/Ping-Windows-v*-arm64.msix
            windows/dist/Ping-Windows-v*-sideload/Ping-Windows-Sideload.cer
            windows/dist/Ping-Windows-v*-sideload/app.ico
            windows/dist/Ping-Windows-v*-sideload/dependencies-*.txt
            windows/dist/Ping-Windows-v*-sideload/Dependencies/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish web download payloads to repository
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_web_downloads }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:PING_WINDOWS_SIGNED -ne "true") {
            throw "Refusing to publish unsigned Windows download payloads. Configure PING_WINDOWS_CERT_BASE64 and PING_WINDOWS_CERT_PASSWORD."
          }

          if ($env:GITHUB_REF_NAME -ne "main") {
            throw "publish_web_downloads must be run from main so the public site deploys the committed binaries."
          }

          [xml]$manifest = Get-Content -Raw -LiteralPath "windows/src/Ping.Windows.App/Package.appxmanifest"
          $identityVersion = [string]$manifest.Package.Identity.Version
          $match = [regex]::Match($identityVersion, '^(?<version>\d+\.\d+\.\d+)\.0$')
          if (-not $match.Success) {
            throw "Package.appxmanifest Identity.Version must use major.minor.patch.0 format. Found $identityVersion."
          }

          $version = $match.Groups["version"].Value
          $releaseDir = "windows/dist/Ping-Windows-v$version-sideload"
          $downloadsDir = "web/public/downloads/windows"
          $payloads = @(
            @{ Source = "windows/dist/PingSetup-v$version.exe"; Destination = "PingSetup-v$version.exe" },
            @{ Source = "$releaseDir/Ping-Windows-v$version-x64.msix"; Destination = "Ping-Windows-v$version-x64.msix" },
            @{ Source = "$releaseDir/Ping-Windows-v$version-arm64.msix"; Destination = "Ping-Windows-v$version-arm64.msix" },
            @{ Source = "$releaseDir/Ping-Windows-Sideload.cer"; Destination = "Ping-Windows-Sideload.cer" },
            @{ Source = "$releaseDir/app.ico"; Destination = "app.ico" },
            @{ Source = "$releaseDir/dependencies-x64.txt"; Destination = "dependencies-x64.txt" },
            @{ Source = "$releaseDir/dependencies-arm64.txt"; Destination = "dependencies-arm64.txt" }
          )

          foreach ($dependency in Get-ChildItem -LiteralPath "$releaseDir/Dependencies" -Recurse -File -Include "*.msix", "*.appx") {
            $relativePath = [System.IO.Path]::GetRelativePath($releaseDir, $dependency.FullName).Replace('\', '/')
            $payloads += @{ Source = $dependency.FullName; Destination = $relativePath }
          }

          foreach ($payload in $payloads) {
            if (-not (Test-Path -LiteralPath $payload.Source)) {
              throw "Missing Windows download payload: $($payload.Source)"
            }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($packagePath in @(
            "$releaseDir/Ping-Windows-v$version-x64.msix",
            "$releaseDir/Ping-Windows-v$version-arm64.msix"
          )) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
            try {
              $hasConfig = $archive.Entries | Where-Object { $_.FullName -eq "Supabase.json" } | Select-Object -First 1
              if (-not $hasConfig) {
                throw "$packagePath does not bundle Supabase.json."
              }
            }
            finally {
              $archive.Dispose()
            }
          }

          New-Item -ItemType Directory -Force -Path $downloadsDir | Out-Null
          foreach ($payload in $payloads) {
            $destinationPath = Join-Path $downloadsDir $payload.Destination
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destinationPath) | Out-Null
            Copy-Item -LiteralPath $payload.Source -Destination $destinationPath -Force
          }
          Set-Content -LiteralPath (Join-Path $downloadsDir "latest-version.txt") -Value $version -Encoding ascii -NoNewline

          git status --short -- $downloadsDir
          $changes = git status --short -- $downloadsDir
          if ([string]::IsNullOrWhiteSpace($changes)) {
            Write-Host "Windows download payloads are already current."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $downloadsDir
          git commit -m "chore(windows): redeploy v$version installer"
          git push origin HEAD:$env:GITHUB_REF_NAME

      - name: Publish GitHub Release assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:PING_WINDOWS_SIGNED -ne "true") {
            throw "Refusing to publish unsigned Windows sideload packages. Configure PING_WINDOWS_CERT_BASE64 and PING_WINDOWS_CERT_PASSWORD."
          }

          [xml]$manifest = Get-Content -Raw -LiteralPath "windows/src/Ping.Windows.App/Package.appxmanifest"
          $identityVersion = [string]$manifest.Package.Identity.Version
          $match = [regex]::Match($identityVersion, '^(?<version>\d+\.\d+\.\d+)\.0$')
          if (-not $match.Success) {
            throw "Package.appxmanifest Identity.Version must use major.minor.patch.0 format. Found $identityVersion."
          }

          $version = $match.Groups["version"].Value
          $tag = "${{ inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "windows-v$version-sideload"
          }

          $releaseDir = "windows/dist/Ping-Windows-v$version-sideload"
          $releaseZip = "windows/dist/Ping-Windows-v$version-sideload.zip"
          $setupExe = "windows/dist/PingSetup-v$version.exe"
          if (-not (Test-Path -LiteralPath $releaseZip)) {
            throw "Missing sideload release zip: $releaseZip"
          }
          if (-not (Test-Path -LiteralPath $setupExe)) {
            throw "Missing Windows setup EXE: $setupExe"
          }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "Ping Windows v$version" --notes "Zero-cost Windows web installer. PingSetup-v$version.exe imports Ping's self-signed MSIX certificate, downloads the right MSIX package from https://0minping.vercel.app/downloads/windows, installs the app, and launches it. Because it is not publicly code-signed, Windows SmartScreen may show a warning."
          }
          gh release edit $tag --title "Ping Windows v$version" --notes "Zero-cost Windows web installer. PingSetup-v$version.exe imports Ping's self-signed MSIX certificate, downloads the right MSIX package from https://0minping.vercel.app/downloads/windows, installs the app, and launches it. Because it is not publicly code-signed, Windows SmartScreen may show a warning."

          gh release upload $tag `
            $setupExe `
            $releaseZip `
            "$releaseDir/Ping-Windows-v$version-x64.msix" `
            "$releaseDir/Ping-Windows-v$version-arm64.msix" `
            "$releaseDir/Ping-Windows-Sideload.cer" `
            "$releaseDir/install-ping-windows.ps1" `
            "$releaseDir/uninstall-ping-windows.ps1" `
            "$releaseDir/dependencies-x64.txt" `
            "$releaseDir/dependencies-arm64.txt" `
            "$releaseDir/SHA256SUMS.txt" `
            --clobber
