name: Ping
options:
  bundleIdPrefix: com.youngminpark.ping
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: ko
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "0.3.64"
    CURRENT_PROJECT_VERSION: "76"
    PRODUCT_NAME: Ping
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    OTHER_CODE_SIGN_FLAGS: "--requirements '=designated => identifier \"com.youngminpark.ping.Ping\"'"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
  PingKit:
    path: PingKit

targets:
  Ping:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Ping.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: PingDebug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Ping.entitlements
    sources:
      - path: Ping
      - path: Resources/LaunchAgents/com.youngminpark.ping.Ping.keepalive.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    resources:
      - path: Resources
        optional: true
    postCompileScripts:
      - name: Copy Supabase Config
        script: |
          set -euo pipefail

          SRC="$PROJECT_DIR/Resources/Supabase.plist"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Supabase.plist"

          if [ -f "$SRC" ]; then
            cp "$SRC" "$DST"
          fi
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Supabase.plist"
    info:
      path: Ping/Info.plist
      properties:
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.social-networking
        LSUIElement: true
        CFBundleName: Ping
        CFBundleDisplayName: Ping
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: "Ping은 3초 영상 메시지 촬영을 위해 카메라를 사용합니다."
        NSMicrophoneUsageDescription: "Ping은 영상 메시지의 음성 녹음을 위해 마이크를 사용합니다."
        CFBundleURLTypes:
          - CFBundleURLName: com.youngminpark.ping.invite
            CFBundleURLSchemes:
              - ping
        SUFeedURL: https://0minping.vercel.app/appcast.xml
        SUPublicEDKey: ZmfTayyDvfWn3zo/4+FoWUFi9MplFtZsjsrZcbijLnM=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
        SUAutomaticallyUpdate: false
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      - package: Supabase
        product: Realtime

  PingTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: PingTests
        PRODUCT_MODULE_NAME: PingTests
    sources:
      - path: PingTests
    postCompileScripts:
      - name: Copy Contract Test Fixtures
        script: |
          set -euo pipefail

          DST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources"
          mkdir -p "$DST"

          cp "$PROJECT_DIR/Ping/UI/Glass/GlassButton.swift" "$DST/GlassButton.swift"
          cp "$PROJECT_DIR/Ping/UI/Glass/GlassChip.swift" "$DST/GlassChip.swift"
          cp "$PROJECT_DIR/Ping/UI/Glass/GlassEffectCompat.swift" "$DST/GlassEffectCompat.swift"
          cp "$PROJECT_DIR/Ping/UI/Glass/GlassPanel.swift" "$DST/GlassPanel.swift"
          cp "$PROJECT_DIR/Ping/UI/Glass/PingDesign.swift" "$DST/PingDesign.swift"
          cp "$PROJECT_DIR/Ping/Capture/CameraManager.swift" "$DST/CameraManager.swift"
          cp "$PROJECT_DIR/Ping/Capture/ScreenCaptureManager.swift" "$DST/ScreenCaptureManager.swift"
          cp "$PROJECT_DIR/Ping/UI/Mirror/MirrorView.swift" "$DST/MirrorView.swift"
          cp "$PROJECT_DIR/Ping/UI/Mirror/PartnerPicker.swift" "$DST/PartnerPicker.swift"
          cp "$PROJECT_DIR/Ping/UI/Setup/PairingView.swift" "$DST/PairingView.swift"
